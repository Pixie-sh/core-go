services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: core-go-e2e-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP listener
      - "${MAILPIT_HTTP_PORT:-8025}:8025"   # Web UI + REST API
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
